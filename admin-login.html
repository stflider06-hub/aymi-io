<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYMI — вход для персонала</title>
<link rel="icon" href="aymi-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FAF8FB; --bg-card:#FFFFFF; --ink:#2A2438; --ink-soft:#8B8296; --line:#E9E3EF;
  --primary:#6B4E8E; --primary-dark:#52396F; --primary-soft:#EEE7F5; --danger:#C1121F; --danger-soft:#FBEAEA;
  --shadow-md: 0 8px 24px rgba(42,36,56,0.12);
  --font-display:'Fraunces',serif; --font-body:'Manrope',sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--font-body); background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-card{ background:var(--bg-card); border-radius:24px; padding:36px 30px; width:100%; max-width:380px; box-shadow:var(--shadow-md); text-align:center; }
.login-mark{ width:64px; height:64px; border-radius:50%; margin:0 auto 16px; overflow:hidden; }
.login-mark img{ width:100%; height:100%; object-fit:cover; }
h1{ font-family:var(--font-display); font-weight:800; font-size:1.3rem; margin-bottom:4px; }
.sub{ color:var(--ink-soft); font-size:0.85rem; margin-bottom:24px; }
.field{ text-align:left; margin-bottom:14px; }
.field label{ font-size:0.78rem; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:6px; }
.field input{ width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); font-family:inherit; font-size:0.92rem; }
.field input:focus{ outline:2px solid var(--primary); outline-offset:1px; }
.submit-btn{ width:100%; padding:13px; border-radius:14px; border:none; background:var(--primary); color:#fff; font-weight:800; font-size:0.92rem; margin-top:8px; }
.submit-btn:hover{ background:var(--primary-dark); }
.submit-btn:disabled{ background:#D8D2E0; }
.form-error{ background:var(--danger-soft); color:var(--danger); border-radius:10px; padding:10px 12px; font-size:0.82rem; margin-bottom:14px; display:none; }
.form-error.show{ display:block; }
.back-link{ display:block; margin-top:18px; color:var(--ink-soft); font-size:0.8rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-mark"><img src="aymi-logo.jpg" alt="AYMI"></div>
  <h1>AYMI — админка</h1>
  <div class="sub">Вход только для персонала</div>
  <div class="form-error" id="formError"></div>
  <form id="loginForm">
    <div class="field"><label>Email</label><input type="email" id="emailInput" required autocomplete="username"></div>
    <div class="field"><label>Пароль</label><input type="password" id="passwordInput" required autocomplete="current-password"></div>
    <button type="submit" class="submit-btn" id="submitBtn">Войти</button>
  </form>
  <a href="index.html" class="back-link">← Вернуться на сайт</a>
</div>
<script>
const SUPABASE_URL = "https://lzqpruamitoyrtkxctcd.supabase.co";
const SUPABASE_KEY = "sb_publishable_rELycZN85GDvAtaWJZKa2g_mlON77V9";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){
    const { data: staffRow } = await supabaseClient.from("staff").select("id, role").eq("id", session.user.id).maybeSingle();
    if(staffRow) window.location.href = "admin.html";
  }
})();

document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const formError = document.getElementById("formError");
  const submitBtn = document.getElementById("submitBtn");
  formError.classList.remove("show");
  submitBtn.disabled = true;
  submitBtn.textContent = "Входим…";
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    formError.textContent = "Неверный email или пароль.";
    formError.classList.add("show");
    submitBtn.disabled = false;
    submitBtn.textContent = "Войти";
    return;
  }
  const { data: staffRow } = await supabaseClient.from("staff").select("id, role").eq("id", data.user.id).maybeSingle();
  if(!staffRow){
    formError.textContent = "Этот аккаунт есть в системе входа, но не добавлен в список персонала (таблица staff). Обратитесь к администратору.";
    formError.classList.add("show");
    await supabaseClient.auth.signOut();
    submitBtn.disabled = false;
    submitBtn.textContent = "Войти";
    return;
  }
  window.location.href = "admin.html";
});
</script>
</body>
</html>
